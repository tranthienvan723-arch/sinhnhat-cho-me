<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY MOTHER</title>

<style>

body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ffc0cb,#ff9ecf);
    font-family: "Segoe UI", cursive;
    text-align:center;
    overflow:hidden;
}

.container{
    position:relative;
    top:20%;
    color:white;
}

h1{
    font-size:40px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

p{
    font-size:20px;
    width:70%;
    margin:auto;
}

.heart{
    position:absolute;
    color:red;
    font-size:24px;
    animation:bay 6s linear infinite;
}

@keyframes bay{
    0%{
        transform:translateY(100vh) scale(1);
        opacity:1;
    }
    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

.flower{
    position:absolute;
    font-size:28px;
    animation:roi 8s linear infinite;
}
.banhkem{
    position:absolute;
    font-size: 30px;
    animation:quay 6s linear infinite;
}
@keyframes quay
{
    0%{
        transform: translateY(0vh) rotate(0deg);
    }
    100%{
        transform: translateY(0vh) rotate(360deg);
    }
}
@keyframes roi{
    0%{
        transform:translateY(-10vh) rotate(0deg);
    }
    100%{
        transform:translateY(110vh) rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="container">
<h1>🎉 Chúc mừng mẹ sinh nhật vui vẻ 🎉</h1>

<p>
Chúc mẹ luôn trẻ đẹp,hạnh phúc,thành công khi bước sang 1 tuổi mới.
</p>

<p>
Yêu mẹ thật nhiều 💖
</p>

</div>

<script>


function taoHoa(){
    const hoa=document.createElement("div");
    hoa.classList.add("flower");
    hoa.innerHTML="🎈";
    hoa.style.left=Math.random()*100+"vw";
    hoa.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(hoa);

    setTimeout(()=>{hoa.remove();},8000);
}
setInterval(taoHoa,700);
function taobanhkem(){
    const cakes=document.createElement("div");
    cakes.classList.add("banhkem");
    cakes.innerHTML="🎂";
    cakes.style.left=Math.random()*100+"vw";
    cakes.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(cakes);

    setTimeout(()=>{cakes.remove();},8000);
}
setInterval(taobanhkem,400)
</script>

</body>
</html>
